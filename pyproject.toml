[project]
name = "factory-sim"
version = "0.0.1"
description = "A fast, tick-exact simulator of an early-game factory, checked against recorded traces of the real game."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["cffi>=1.17", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "setuptools>=70"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
