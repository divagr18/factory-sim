[project]
name = "factory-sim"
version = "0.1.2"
description = "A fast, tick-exact simulator of an early-game factory, checked against recorded traces of the real game."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Divyansh Agrawal" }]
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["cffi>=1.17", "numpy>=2"]

[build-system]
# setup.py hands cffi the C extension; everything else is declared here.
requires = ["setuptools>=70", "cffi>=1.17"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fsim*", "evolve*"]

[tool.setuptools.package-data]
fsim = ["data/*.json", "data/*.xz"]

[project.optional-dependencies]
# Gymnasium adapters: fsim/gym_env.py.
gym = ["gymnasium>=1.0"]
# What fsim/puffer_env.py needs besides PufferLib itself. PufferLib 3.0.0 pins
# numpy<2 and gymnasium<=0.29.1 and will not build on Windows, so listing it
# here would make the lock unsolvable; on Linux: `pip install --no-deps pufferlib`.
puffer = ["gymnasium>=1.0", "gym>=0.26", "psutil"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "setuptools>=70"]
# Only for train.py. Not synced by default, so CI and the simulator stay
# torch-free: `uv sync --group train`.
train = ["torch>=2.5"]

# CUDA wheels; PyPI's default torch is CPU-only.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
