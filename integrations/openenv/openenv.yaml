spec_version: 1
name: factory_sim
version: 0.1.0
description: >-
  Build an iron smelting line in factory-sim, a tick-exact simulator of Factorio's
  early game. Program mode scores one Python builder program on many scenes
  (reward = success rate); tool mode plays one scene a World call at a time
  (reward = 1 on a verified line).
type: space
runtime: fastapi
app: server.app:app
port: 8000
client:
  class_name: FactorySimEnv
  module: factory_sim_env.client
action:
  class_name: FactorySimAction
  module: factory_sim_env.models
observation:
  class_name: FactorySimObservation
  module: factory_sim_env.models
default_image: factory-sim-env:latest
validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 4.0
    memory_mb: 2048
    disk_mb: 1024
    episode_timeout_s: 300.0
  capabilities:
    verifier:
      kind: reward_channel
  types:
    tags: [factorio, program-synthesis, agentic, verifiable-reward]
