[project]
name = "factorio-tools"
version = "0.1.0"
description = "Build a working smelting line in factory-sim, a Factorio early-game simulator, one world.* tool call at a time; reward is verified success."
tags = ["tool-use", "multi-turn", "simulation", "agent", "eval"]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    # Shares scene selection with factorio-build. Like factorio-build, it also
    # needs a factory-sim checkout on PYTHONPATH (see factorio_build/README.md).
    "factorio-build",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorio_tools"]
