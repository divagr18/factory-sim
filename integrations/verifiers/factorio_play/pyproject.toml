[project]
name = "factorio-play"
version = "0.1.1"
description = "Build a working Factorio smelting line one tool call at a time, in a tick-exact simulator; the reward is the line's verified output."
tags = [
    "multi-turn", "tool-use", "agent", "agentic", "train", "eval", "v1", "game", "factorio",
    "planning", "reasoning", "rl", "rlvr", "simulation",
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "factory-sim>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorio_play"]
