[project]
name = "factorio-build"
version = "0.1.1"
description = "Write one program that builds a working Factorio smelting line, scored in a tick-exact simulator on scenes it has not seen."
tags = ["program-synthesis", "code", "simulation", "planning", "single-turn", "train", "eval", "v1"]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "datasets",
    "factory-sim>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorio_build"]

# Read by the v0 `vf-eval` / `prime eval run`.
[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
