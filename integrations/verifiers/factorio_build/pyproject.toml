[project]
name = "factorio-build"
version = "0.2.0"
description = "Write one program that builds a working Factorio factory, a smelting line or a belt-fed line to a chest, scored in a tick-exact simulator on scenes it has not seen."
tags = [
    "single-turn", "train", "eval", "v1", "game", "factorio", "coding", "python", "reasoning",
    "rl", "rlvr", "planning", "program-synthesis", "alphaevolve", "evolutionary-search", "simulation",
]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "datasets",
    "factory-sim>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factorio_build"]

# Read by the v0 `vf-eval` / `prime eval run`.
[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
